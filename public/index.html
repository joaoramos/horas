<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horas · Jardim da Mata</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/jm/design-system/logo/favicon-32.png">
  <!-- Ecrã principal: cada pessoa guarda a sua página (ex.: /mariana). O manifesto é gerado
       pelo Worker para a página atual, para que a app abra sempre onde foi adicionada. -->
  <link rel="manifest" id="manifesto" href="/manifest.webmanifest">
  <script>document.getElementById('manifesto').href = '/manifest.webmanifest?pagina=' + encodeURIComponent(location.pathname);</script>
  <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Horas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fdf2dc">
  <!-- Estilos do site do Jardim da Mata, copiados sem alterações (npm run sincronizar-estilos) -->
  <link rel="stylesheet" href="/jm/design-system/tokens.css">
  <link rel="stylesheet" href="/jm/novo/site.css">
  <link rel="stylesheet" href="/jm/novo/themes.css">
  <script src="/jm/novo/theme-switcher.js"></script>
  <!-- Componentes próprios desta app -->
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="/">
      <img src="/jm/design-system/logo/jardim-da-mata-mark.png" alt="Horas — página inicial">
    </a>
    <nav class="site-nav" aria-label="Principal">
      <ul>
        <li><a href="/">Equipa</a></li>
        <li><a href="/regras">Regras</a></li>
      </ul>
    </nav>
  </header>
  <main id="app" tabindex="-1">
    <section class="band hero">
      <p class="a-carregar">A carregar…</p>
    </section>
  </main>
  <footer class="site-footer">
    <img src="/jm/design-system/logo/jardim-da-mata-mark.png" alt="">
    <p><strong>Horas</strong>
      Registo e compensação de horas da equipa do Jardim da Mata</p>
  </footer>
</body>
</html>
